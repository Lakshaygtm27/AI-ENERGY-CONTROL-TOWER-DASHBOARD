version: '3.9'

# ====================================================================
# DOCKER COMPOSE - AI Energy Control Tower
# Production-grade infrastructure with all services
# Services: Zookeeper, Kafka, PostgreSQL, Kafka UI, Python App
# ====================================================================

services:

  # =====================================================================
  # ZOOKEEPER - Kafka Coordination
  # =====================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: energy-tower-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - energy-tower-network
    healthcheck:
      test: echo stat | nc localhost 2181
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log


  # =====================================================================
  # KAFKA - Message Streaming Platform
  # =====================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: energy-tower-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_COMPRESSION_TYPE: snappy
      KAFKA_LOG_CLEANUP_POLICY: delete
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - energy-tower-network
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    volumes:
      - kafka-data:/var/lib/kafka/data


  # =====================================================================
  # POSTGRESQL - Primary Database
  # ====================================================================
  postgres:
    image: postgres:15-alpine
    container_name: energy-tower-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_tower
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    networks:
      - energy-tower-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schemas:/docker-entrypoint-initdb.d:ro


  # =====================================================================
  # KAFKA UI - Web Interface for Kafka Management
  # =====================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: energy-tower-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_METRICS_PORT: 9999
      LOGGING_LEVEL_ROOT: INFO
    ports:
      - "8080:8080"
    networks:
      - energy-tower-network
    restart: unless-stopped


  # =====================================================================
  # ADMINER - Database Management Interface
  # =====================================================================
  adminer:
    image: adminer:latest
    container_name: energy-tower-adminer
    depends_on:
      - postgres
    ports:
      - "8081:8080"
    networks:
      - energy-tower-network
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres


  # =====================================================================
  # PYTHON APP - FastAPI Backend
  # ====================================================================
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: energy-tower-app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: energy_tower
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    networks:
      - energy-tower-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      - .:/app
      - ./logs:/app/logs
    working_dir: /app
    command: >
      bash -c "
      pip install -r requirements.txt &&
      python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "


  # =====================================================================
  # STREAMING PRODUCERS & CONSUMERS (Optional - Start manually)
  # =====================================================================
  # Uncomment below to run producers in separate containers
  # producer:
  #   build:
  #     context: .
  #     dockerfile: docker/Dockerfile.producer
  #   container_name: energy-tower-producer
  #   depends_on:
  #     kafka:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  #   networks:
  #     - energy-tower-network
  #   restart: unless-stopped


# =====================================================================
# NETWORKS
# =====================================================================
networks:
  energy-tower-network:
    driver: bridge


# =====================================================================
# VOLUMES
# =====================================================================
volumes:
  zookeeper-data:
    driver: local
  zookeeper-logs:
    driver: local
  kafka-data:
    driver: local
  postgres-data:
    driver: local


# =====================================================================
# USAGE COMMANDS
# =====================================================================
# Start all services:
#   docker-compose up -d
#
# View logs:
#   docker-compose logs -f app
#   docker-compose logs -f kafka
#   docker-compose logs -f postgres
#
# Stop all services:
#   docker-compose down
#
# Remove volumes (clean slate):
#   docker-compose down -v
#
# Access web UIs:
#   Kafka UI:      http://localhost:8080
#   Adminer:       http://localhost:8081
#   FastAPI Docs:  http://localhost:8000/api/docs
#   FastAPI Redoc: http://localhost:8000/api/redoc
# ====================================================================
